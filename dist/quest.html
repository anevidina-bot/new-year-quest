<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Снегоград — задание</title>
  <style>
    :root{--paper:#fff9e9;--ink:#30344c;--gold:#efbf59;--night:#112e4e}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#153755;color:#fff;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}.scene{isolation:isolate;position:relative;min-height:100svh;overflow:hidden;background:#183653}.scene:before{content:"";position:absolute;inset:0;background:center/cover no-repeat;z-index:-3;animation:fade 1s ease both}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,23,45,.73),transparent 35%,transparent 67%,rgba(5,23,45,.62));z-index:-2}.scene.clock:before{background-image:url("assets/clock-square-task.png")}.scene.post:before{background-image:url("assets/post-office-task.png")}.scene.forest:before{background-image:url("assets/lost-gifts-task.png")}.top{position:absolute;z-index:5;top:clamp(18px,4vw,45px);left:50%;transform:translateX(-50%);width:min(770px,calc(100% - 36px));text-align:center;text-shadow:0 2px 8px #08213c}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#f8d989;font-weight:900}.top h1{font:clamp(30px,5vw,52px)/1 Georgia,serif;margin:8px 0 10px}.top p{margin:0 auto;max-width:660px;font-size:clamp(15px,2vw,18px);line-height:1.45;color:#fff8e8}.clue{position:absolute;z-index:3;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;border-radius:18px;outline:0}.clue:after{content:"";position:absolute;inset:-7px;border:2px solid transparent;border-radius:18px;transition:.18s}.clue:hover:after,.clue:focus-visible:after{border-color:#fff3b6;box-shadow:0 0 0 5px #eabb6850}.clock .mittens{left:17%;top:78%;width:18%;height:21%}.clock .tea{left:51%;top:76%;width:26%;height:24%}.clock .bell{left:85%;top:78%;width:14%;height:21%}.post .letter-one{left:34%;top:80%;width:18%;height:18%}.post .letter-two{left:51%;top:80%;width:19%;height:18%}.post .letter-three{left:68%;top:80%;width:18%;height:18%}.forest .train{left:25%;top:72%;width:26%;height:31%}.forest .trophy{left:51%;top:69%;width:19%;height:33%}.forest .puzzle{left:76%;top:72%;width:24%;height:30%}.forest .clue.found{pointer-events:none}.forest .clue.found:after{border-color:#ffe297;box-shadow:0 0 0 5px #eabb6877,0 0 20px #f7c967}.forest .clue.found:before{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(35px,6vw,70px);color:#fff0a6;text-shadow:0 0 18px #f5a93a;animation:found .6s ease both}@keyframes found{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.hint{position:absolute;z-index:6;left:50%;bottom:25px;transform:translateX(-50%);background:#102d4bdf;border:1px solid #f8d98977;border-radius:999px;padding:9px 14px;font-size:13px;white-space:nowrap;backdrop-filter:blur(5px);color:#fff8e7}.hint b{color:#f8d989}.feedback{display:none;position:absolute;z-index:10;left:50%;top:53%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 38px));padding:clamp(23px,4vw,37px);background:var(--paper);color:var(--ink);border-radius:18px;text-align:center;box-shadow:0 25px 54px #001c}.feedback.show{display:block;animation:card .35s cubic-bezier(.18,.8,.3,1) both}.feedback h2{font:clamp(28px,4vw,38px)/1.05 Georgia,serif;color:#573b25;margin:0 0 12px}.feedback p{line-height:1.55;margin:0}.feedback.bad{background:#fff4eb}.feedback.bad h2{font-size:28px;color:#8e4d50}.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:14px;padding:14px 18px;margin-top:20px;background:var(--gold);color:#51350b;font-weight:950;font-size:16px;box-shadow:0 5px 0 #bc842d;cursor:pointer}.btn:hover{transform:translateY(-2px)}.spark{display:none;position:absolute;z-index:8;font-size:clamp(60px,12vw,130px);color:#fff0a6;text-shadow:0 0 20px #f5a93a,0 0 60px #f5a93a;pointer-events:none}.spark.show{display:block;animation:spark .85s ease both}.clock .spark{left:51%;top:68%}.post .spark{left:51%;top:65%}.forest .spark{left:76%;top:54%}.done .clue{pointer-events:none;opacity:.4}.done .clue.correct{opacity:1;filter:drop-shadow(0 0 20px #f7c967);animation:glow 1s ease-in-out infinite alternate}@keyframes fade{from{opacity:.45;transform:scale(1.025)}to{opacity:1;transform:none}}@keyframes card{from{opacity:0;transform:translate(-50%,-45%) scale(.88)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes spark{0%{opacity:0;transform:translate(-50%,-20%) scale(.3)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}@keyframes glow{to{filter:drop-shadow(0 0 30px #f7c967)}}
    @media(max-width:700px){.scene:before{background-position:51% center}.top{top:24px}.top h1{font-size:32px}.top p{font-size:14px}.hint{bottom:15px;font-size:11px}.clock .mittens{left:17%;top:79%;width:25%;height:20%}.clock .tea{left:51%;top:77%;width:32%;height:20%}.clock .bell{left:86%;top:79%;width:19%;height:20%}.post .letter-one{left:33%;top:80%;width:21%;height:15%}.post .letter-two{left:51%;top:80%;width:20%;height:15%}.post .letter-three{left:69%;top:80%;width:21%;height:15%}.forest .train{left:25%;top:72%;width:30%;height:28%}.forest .trophy{left:51%;top:69%;width:24%;height:29%}.forest .puzzle{left:77%;top:72%;width:28%;height:28%}}
    @media(max-aspect-ratio:1/1){.scene{background:linear-gradient(#245275 0 52vw,#163957 70vw,#102c49 100%)}.scene:before{background-size:100% auto;background-position:center top;background-repeat:no-repeat}.scene:after{background:linear-gradient(180deg,rgba(5,23,45,.52),transparent 27vw,rgba(5,23,45,.08) 52vw,rgba(5,23,45,.63) 72vw)}.clock .mittens{left:17%;top:43vw;width:20vw;height:13vw}.clock .tea{left:51%;top:42vw;width:28vw;height:15vw}.clock .bell{left:85%;top:43vw;width:15vw;height:13vw}.post .letter-one{left:34%;top:45vw;width:20vw;height:12vw}.post .letter-two{left:51%;top:45vw;width:20vw;height:12vw}.post .letter-three{left:68%;top:45vw;width:20vw;height:12vw}.forest .train{left:25%;top:40vw;width:28vw;height:18vw}.forest .trophy{left:51%;top:39vw;width:22vw;height:20vw}.forest .puzzle{left:76%;top:40vw;width:27vw;height:18vw}.clock .spark{top:38vw}.post .spark{top:38vw}.forest .spark{top:31vw}.hint{top:55vw;bottom:auto}.top{top:18px}}
  </style>
  <style>
    .post .clue.sorted{pointer-events:none}.post .clue.sorted:before{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(28px,5vw,58px);font-weight:900;text-shadow:0 0 15px #fff}.post .clue.delivered:before{content:'✦';color:#fff0a6}.post .clue.returned:before{content:'↶';color:#d5e5f4}.post .clue.sorted:after{border-color:#ffe297;box-shadow:0 0 0 5px #eabb6877,0 0 20px #f7c967}.feedback .secondary{margin-left:8px;background:#d8e1e5;color:#394453;box-shadow:0 5px 0 #9eacb2}.feedback .secondary:hover{transform:translateY(-2px)}.observatory:before{background-image:url("assets/observatory-task.png")}.observatory .hint{display:none}.observatory .spark{left:38%;top:18%;font-size:clamp(80px,16vw,180px)}.observatory.stars-restored:after{background:radial-gradient(circle at 38% 18%,#fff5bb44,transparent 17%),linear-gradient(180deg,rgba(5,23,45,.46),transparent 35%,transparent 67%,rgba(5,23,45,.55))}.dial-panel{position:absolute;z-index:7;left:50%;bottom:clamp(18px,4vw,38px);transform:translateX(-50%);width:min(640px,calc(100% - 32px));padding:16px 18px 15px;background:#102d4bea;border:1px solid #f8d98988;border-radius:20px;text-align:center;box-shadow:0 15px 36px #0017;backdrop-filter:blur(8px)}.dial-clue{margin:0 auto 12px;max-width:550px;font:15px/1.35 Georgia,serif;color:#fff7df}.dial-row{display:flex;justify-content:center;gap:clamp(10px,3vw,24px);margin:4px 0 12px}.dial{display:grid;place-items:center;width:clamp(57px,10vw,82px);aspect-ratio:1;border:2px solid #f6d77c;border-radius:50%;background:radial-gradient(circle at 35% 30%,#355d7d,#14304e 67%);box-shadow:inset 0 0 0 5px #d0a64d44,0 4px 0 #071a2f;color:#fff1b6;font-size:clamp(30px,5vw,47px);cursor:pointer;transition:.18s transform}.dial:hover{transform:rotate(12deg) scale(1.07)}.dial:focus-visible{outline:3px solid #fff5c4;outline-offset:3px}.dial-action{margin-top:0}.dial-panel.shake{animation:shake .35s linear}@keyframes shake{25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}@media(max-width:480px){.feedback .secondary{margin-left:0}.dial-panel{padding:13px 11px}.dial-clue{font-size:13px}}
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <header class="top"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="lead"></p></header>
    <div id="clues"></div><section class="dial-panel" id="dialPanel" hidden></section><div class="spark" id="spark">✦</div><div class="hint" id="hint"></div>
    <section class="feedback" id="feedback"></section>
  </main>
  <script>
    const stage=Number(new URLSearchParams(location.search).get('stage'))||0;
    const tasks=[
      {kind:'clock',eyebrow:'Искра 1 из 4',title:'Площадь застывших часов',lead:'Фонарщик шепчет: «Часы пойдут, когда мы вспомним, что умеет согреть целый зимний вечер». Помогите Плюшу выбрать улику.',hint:'<b>Осмотрите</b> три вещи, оставленные на снегу',correct:'tea',choices:[['mittens','Рассмотреть варежки'],['tea','Рассмотреть чай и чашки'],['bell','Рассмотреть колокольчик']],bad:{mittens:'Варежки замечательные, но они греют только руки. Плюш качает головой и продолжает искать.',bell:'Колокольчик звенит красиво, но ему одному не собрать людей рядом.'},success:'От чашек поднимается пар, и стрелка часов едва заметно вздрагивает. Верно: не чай сам по себе, а <b>чай и разговор</b> умеют согреть целый вечер.'},
      {kind:'post',mode:'sort',eyebrow:'Искра 2 из 4',title:'Почтамт неотправленных пожеланий',lead:'Сортировочная лента остановилась. Откройте письма и решите: каким из них стоит дать крылья?',hint:'<b>Откройте</b> письмо и отправьте его в нужный ящик',choices:[['letter-one','Открыть кремовое письмо'],['letter-two','Открыть красное письмо'],['letter-three','Открыть зелёное письмо']],letters:{'letter-one':{text:'«Пусть всё будет только по-моему»',action:'return'},'letter-two':{text:'«Мне всё равно»',action:'return'},'letter-three':{text:'«Спасибо, что ты рядом. Пусть в новом году будет больше времени для важных людей»',action:'deliver'}},success:'Последнее письмо скользит в доставку, и лента оживает золотым светом. Вторая искра шепчет: <b>добрые слова всегда находят дорогу.</b>'},
      {kind:'forest',mode:'collect',eyebrow:'Искра 3 из 4',title:'Лес потерянных даров',lead:'В трёх дарах спрятались части праздничного пожелания. Найдите все огоньки, чтобы собрать его.',hint:'<b>Исследуйте</b> каждый из трёх даров',choices:[['train','Рассмотреть игрушечный поезд'],['trophy','Рассмотреть золотой кубок'],['puzzle','Рассмотреть зелёный подарок']],fragments:{train:'Первый огонёк: <b>умение замечать маленькие радости</b>.',trophy:'Второй огонёк: <b>время, которое мы дарим друг другу</b>.',puzzle:'Третий огонёк: <b>приглашение собраться вместе</b>.'},success:'Три огонька соединяются над лесной тропой. Третья искра знает секрет: <b>радость становится больше, когда ею делятся.</b>'},
      {kind:'observatory',mode:'dials',eyebrow:'Финальная искра',title:'Крыши звездочётов',lead:'Телескоп видит путь Главной Звезды, но три астрономических кольца сбились. Восстановите порядок, который Плюш открыл в городе.',clue:'Сначала вспомните то, что согрело зимний вечер. Затем — слова, которые нашли адресата. И наконец — дар, которым хочется поделиться.',symbols:['☕','✉','🎁','❄'],code:[0,1,2],success:'Кольца сходятся, телескоп вспыхивает, и Главная Звезда занимает своё место над Снегоградом. В окнах города загорается праздник.'}
    ];
    const task=tasks[Math.min(stage,tasks.length-1)],scene=document.querySelector('#scene'),feedback=document.querySelector('#feedback'),spark=document.querySelector('#spark'),clues=document.querySelector('#clues'),dialPanel=document.querySelector('#dialPanel');let dialValues=[2,3,1];
    scene.classList.add(task.kind);document.querySelector('#eyebrow').textContent=task.eyebrow;document.querySelector('#title').textContent=task.title;document.querySelector('#lead').textContent=task.lead;
    if(task.mode==='dials'){renderDials()}else{document.querySelector('#hint').innerHTML=task.hint;clues.innerHTML=task.choices.map(([id,label])=>`<button class="clue ${id}${id===task.correct?' correct':''}" aria-label="${label}" data-choice="${id}"></button>`).join('');document.querySelectorAll('.clue').forEach(button=>button.addEventListener('click',()=>choose(button.dataset.choice)))}
    const collected=new Set(),sorted=new Set();
    function choose(choice){if(task.mode==='collect'){collectFragment(choice);return}if(task.mode==='sort'){openLetter(choice);return}if(choice===task.correct){showSuccess()}else{feedback.className='feedback bad show';feedback.innerHTML=`<h2>Пока не то</h2><p>${task.bad[choice]}</p><button class="btn" onclick="closeFeedback()">Искать дальше</button>`}}
    function collectFragment(choice){if(collected.has(choice))return;collected.add(choice);document.querySelector(`[data-choice="${choice}"]`).classList.add('found');const count=collected.size;if(count===task.choices.length){showSuccess();return}feedback.className='feedback show';feedback.innerHTML=`<h2>Огонёк ${count} из 3</h2><p>${task.fragments[choice]}</p><button class="btn" onclick="closeFeedback()">Искать дальше</button>`}
    function openLetter(choice){if(sorted.has(choice))return;const letter=task.letters[choice];feedback.className='feedback show';feedback.innerHTML=`<h2>Письмо</h2><p>${letter.text}</p><p><b>Куда его направить?</b></p><button class="btn" onclick="sortLetter('${choice}','deliver')">В доставку →</button><button class="btn secondary" onclick="sortLetter('${choice}','return')">Вернуть в ящик</button>`}
    function sortLetter(choice,action){const letter=task.letters[choice];if(letter.action!==action){feedback.className='feedback bad show';feedback.innerHTML=`<h2>Сортировочная машина звякает</h2><p>Похоже, это письмо выбрало не тот ящик. Прочитайте его ещё раз.</p><button class="btn" onclick="openLetter('${choice}')">Попробовать снова</button>`;return}sorted.add(choice);document.querySelector(`[data-choice="${choice}"]`).classList.add('sorted',action==='deliver'?'delivered':'returned');if(sorted.size===task.choices.length){showSuccess();return}feedback.className='feedback show';feedback.innerHTML=`<h2>Письмо отсортировано</h2><p>${sorted.size} из 3 писем нашли свой ящик. На ленте осталось ещё ${task.choices.length-sorted.size}.</p><button class="btn" onclick="closeFeedback()">Продолжить сортировку</button>`}
    function renderDials(){dialPanel.hidden=false;dialPanel.innerHTML=`<p class="dial-clue">${task.clue}</p><div class="dial-row">${dialValues.map((value,index)=>`<button class="dial" aria-label="Повернуть кольцо ${index+1}" onclick="cycleDial(${index})">${task.symbols[value]}</button>`).join('')}</div><button class="btn dial-action" onclick="checkDials()">Навести телескоп →</button>`}
    function cycleDial(index){dialValues[index]=(dialValues[index]+1)%task.symbols.length;renderDials()}
    function checkDials(){if(dialValues.every((value,index)=>value===task.code[index])){showSuccess();return}dialPanel.classList.remove('shake');void dialPanel.offsetWidth;dialPanel.classList.add('shake');feedback.className='feedback bad show';feedback.innerHTML='<h2>Звезда пока не откликается</h2><p>Проверьте порядок воспоминаний: тепло вечера, слова, которые нашли адресата, и радость, которой делятся.</p><button class="btn" onclick="closeFeedback()">Повернуть кольца</button>'}
    function showSuccess(){scene.classList.add('done');spark.classList.add('show');if(task.mode==='dials'){scene.classList.add('stars-restored');dialPanel.hidden=true;feedback.className='feedback show';feedback.innerHTML=`<h2>Главная Звезда вернулась!</h2><p>${task.success}</p><button class="btn" onclick="showPrediction()">Открыть предсказание →</button>`;return}const sparkName=['Первая','Вторая','Третья','Четвёртая'][stage]||'Новая';feedback.className='feedback show';feedback.innerHTML=`<h2>${sparkName} искра найдена!</h2><p>${task.success}</p><button class="btn" onclick="location.href='index.html?completed=${stage+1}'">Вернуться к карте →</button>`}
    function showPrediction(){const predictions=['В новом году вы найдёте время для дела, которое давно ждало вашего первого шага.','Вас ждёт разговор, после которого одна хорошая идея станет общей.','В следующем году ваш маленький жест принесёт кому-то большую поддержку.','Удача придёт не шумно, а в тот момент, когда вы решите поделиться теплом.'];const prediction=predictions[Math.floor(Math.random()*predictions.length)],destination='final.html?prediction='+encodeURIComponent(prediction);feedback.className='feedback show';feedback.innerHTML=`<h2>Ваше предсказание</h2><p>${prediction}</p><button class="btn" onclick="location.href='${destination}'">Выйти на праздничную площадь →</button>`}
    function closeFeedback(){feedback.className='feedback'}
  </script>
</body>
</html>
