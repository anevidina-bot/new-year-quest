<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Снегоград: спасите Новый год</title><style>
:root{--ink:#34335c;--plum:#5d4b88;--night:#21345f;--paper:#fffaf0;--gold:#efb950;--shadow:0 18px 45px #4a518429}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#bfdcf1;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background-image:radial-gradient(#fff 1.4px,transparent 1.8px),linear-gradient(145deg,#b4d8ee,#e5f0ec 52%,#f4dfc5);background-size:29px 29px,auto}button,input{font:inherit}.shell{max-width:1040px;margin:auto;padding:24px 16px 46px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 2px 0 #6d8dad;font-weight:900;letter-spacing:.07em;font-size:13px}.stat{background:#fffdf3;color:var(--plum);padding:8px 13px;border-radius:99px;box-shadow:0 4px 0 #a8c0d2;text-shadow:none}.book{margin-top:15px;background:var(--paper);border:7px solid #fffdf7;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:650px;position:relative}.paper-edge{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 25px,#00000006 26px);opacity:.5}.screen{position:relative;z-index:1;padding:clamp(24px,5vw,48px);animation:appear .35s ease both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#bd6971}.hero{display:grid;grid-template-columns:1fr .9fr;align-items:center;gap:20px}.hero h1{font-family:Georgia,serif;font-size:clamp(40px,7vw,70px);line-height:.94;color:var(--night);margin:10px 0 17px;letter-spacing:-.055em}.hero p,.text{font-size:18px;line-height:1.55;max-width:620px}.btn{border:0;border-radius:15px;cursor:pointer;padding:14px 19px;margin:13px 8px 0 0;font-weight:900;color:#fff;background:var(--plum);box-shadow:0 5px 0 #3d2e60;transition:.16s transform}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px)}.btn.gold{color:#634200;background:var(--gold);box-shadow:0 5px 0 #c78b29}.btn.ghost{color:var(--plum);background:#fff;border:2px solid #d7c4de;box-shadow:0 4px 0 #d7c4de}.cat-wrap{display:grid;place-items:center;min-height:290px}.cat{position:relative;width:170px;height:164px;filter:drop-shadow(0 8px 0 #dbe3e5)}.cat .head{position:absolute;width:122px;height:109px;border:5px solid var(--ink);border-radius:52% 52% 48% 48%;left:25px;top:18px;background:#f2ae69;z-index:3}.cat .head:before,.cat .head:after{content:"";position:absolute;top:-30px;width:51px;height:57px;background:#f2ae69;border:5px solid var(--ink);z-index:-1}.cat .head:before{left:0;border-radius:13px 47px 7px 42px;transform:rotate(-13deg)}.cat .head:after{right:0;border-radius:47px 13px 42px 7px;transform:rotate(13deg)}.cat .face{position:absolute;top:49px;left:24px;width:66px;height:40px;border-bottom:4px solid var(--ink);border-radius:50%}.cat .face:before,.cat .face:after{content:"";position:absolute;width:8px;height:12px;background:var(--ink);border-radius:50%;top:-10px}.cat .face:before{left:10px}.cat .face:after{right:10px}.cat .nose{position:absolute;top:76px;left:56px;width:11px;height:8px;background:#d66d76;border-radius:70% 70% 90% 90%}.cat .body{position:absolute;left:41px;top:110px;width:96px;height:59px;background:#f2ae69;border:5px solid var(--ink);border-radius:48px 48px 21px 21px}.cat .scarf{position:absolute;z-index:4;top:117px;left:39px;width:102px;height:20px;border-radius:20px;background:#db6570;border:4px solid var(--ink)}.cat .tail{position:absolute;right:0;top:122px;width:57px;height:59px;border:14px solid var(--ink);border-left:0;border-radius:0 50px 50px 0;transform:rotate(-18deg)}.cat .tail:after{content:"";position:absolute;right:-9px;top:-12px;width:28px;height:28px;border-radius:50%;background:#f2ae69}.hero-stars{font-size:28px;letter-spacing:11px;color:var(--gold);text-align:center}.map-screen{padding:27px 28px 25px}.map-head{display:flex;justify-content:space-between;align-items:end;gap:10px}.map-head h2,.task h2,.ending h1{font-family:Georgia,serif;color:var(--night);font-size:clamp(30px,5vw,46px);letter-spacing:-.045em;margin:4px 0}.map{height:468px;margin:17px -7px 14px;position:relative;overflow:hidden;border-radius:23px;border:3px solid #a5c5cb;background:linear-gradient(145deg,#d7eef1 0 35%,#b8d8c9 36% 61%,#a6c8b3 62%);box-shadow:inset 0 0 0 5px #ebf7ed}.river{position:absolute;width:130%;height:90px;left:-15%;top:200px;background:#9ed2e2;border-top:4px solid #6aa8c1;border-bottom:4px solid #6aa8c1;transform:rotate(-7deg);border-radius:50%}.road{position:absolute;height:4px;border-top:4px dashed #d8a96b;transform-origin:left center}.r1{width:230px;left:16%;top:70%;transform:rotate(-35deg)}.r2{width:235px;left:36%;top:47%;transform:rotate(17deg)}.r3{width:230px;left:58%;top:40%;transform:rotate(49deg)}.house{position:absolute;font-size:54px;filter:drop-shadow(0 3px 0 #698a8b)}.h1{left:7%;top:15%}.h2{left:41%;top:5%}.h3{right:8%;bottom:9%}.label{position:absolute;font-size:11px;color:#486577;font-weight:900;letter-spacing:.04em}.l1{left:5%;top:36%}.l2{left:38%;top:24%}.l3{right:5%;top:69%}.place{position:absolute;width:116px;min-height:67px;padding:8px 7px;background:#fffaf0;border:2px solid #9e755a;border-radius:15px;box-shadow:0 4px 0 #b68b6e;color:var(--ink);font-size:12px;font-weight:900;cursor:pointer;line-height:1.05;text-align:center;transition:.15s}.place span{display:block;font-size:28px;margin-bottom:3px}.place:hover:not(:disabled){transform:translateY(-3px)}.place:disabled{opacity:.52;cursor:default}.place.current{outline:4px solid #f3c65c;animation:glow 1s ease-in-out infinite alternate}@keyframes glow{to{outline-color:#fff3b6}}.place.done{background:#e9f7df;border-color:#6ca985;box-shadow:0 4px 0 #78a98b}.p0{left:8%;bottom:12%}.p1{left:32%;top:37%}.p2{left:61%;top:25%}.p3{right:8%;bottom:13%}.map-cat{position:absolute;width:54px;height:50px;z-index:4;transition:all .7s cubic-bezier(.3,.85,.3,1);filter:drop-shadow(0 3px 0 #75929a);font-size:47px;line-height:1}.map-cat:after{content:"";position:absolute;inset:16px -4px -5px 8px;background:#fff9ee;border:2px solid #4b4e66;border-radius:55% 48% 55% 55%;z-index:-1}.map-cat span{position:relative;z-index:1}.progress{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:850}.progress i{display:block;width:23px;height:8px;border-radius:8px;background:#ded7cc}.progress i.on{background:var(--gold)}.task{max-width:720px;margin:auto}.badge{display:inline-flex;padding:7px 10px;border-radius:99px;background:#f7df9c;font-size:13px;font-weight:900;color:#765922}.story-box{background:#f1e7d9;border-left:5px solid #da8a72;padding:17px 19px;border-radius:13px;margin:19px 0;font-size:18px;line-height:1.5}.options{display:grid;gap:10px;margin:20px 0}.option{border:2px solid #ddcab4;background:#fffdf6;border-radius:16px;padding:14px 16px;text-align:left;color:var(--ink);font-weight:800;cursor:pointer}.option:hover{background:#fff1d5;border-color:#d49472}.feedback{margin-top:15px;padding:14px 16px;background:#e5f5e7;border-radius:14px;color:#306653;font-weight:750;line-height:1.45}.feedback.bad{background:#fde6df;color:#913e48}.letter-grid{display:flex;flex-wrap:wrap;gap:9px;margin:19px 0}.letter{border:2px solid #c7b5dc;background:#fff;border-radius:12px;width:58px;height:58px;cursor:pointer;font-weight:950;font-size:22px;color:var(--plum)}.letter.used{opacity:.3;transform:scale(.9)}.answer-line{min-height:42px;border-bottom:3px dashed #a48dbd;font-size:26px;font-weight:950;letter-spacing:9px;color:var(--plum);margin:11px 0}.riddle{background:#e9e5f6;border-radius:18px;padding:20px;font-size:20px;line-height:1.4;font-weight:800}.code{display:flex;gap:8px;margin-top:19px}.code input{width:58px;height:57px;border:2px solid #c9b8d6;border-radius:12px;text-align:center;text-transform:uppercase;font-size:25px;font-weight:900;color:var(--plum)}.choice-row{display:flex;flex-wrap:wrap;gap:10px}.choice{flex:1;min-width:160px;border:2px solid #dbc8aa;background:#fffdf6;border-radius:16px;padding:16px;text-align:left;color:var(--ink);cursor:pointer;font-weight:850}.choice:hover{border-color:#db7d73;background:#fff1dc}.ending{text-align:center;max-width:700px;margin:auto}.ending .cat-wrap{min-height:190px}.card{background:linear-gradient(135deg,#39426e,#6c588e);color:white;border-radius:22px;padding:25px;margin:22px 0;box-shadow:0 8px 0 #403359}.card h3{margin:0;color:#ffe7a8;font-size:25px}.card p{font-size:18px;line-height:1.5}.confetti{color:#eeb653;font-size:28px;letter-spacing:12px}.hint{font-size:13px;color:#766e78}.walk{animation:walk .4s ease-in-out infinite alternate}@keyframes walk{to{transform:translateY(-6px) rotate(-3deg)}}@media(max-width:600px){.shell{padding:12px 8px 28px}.book{border-width:4px;border-radius:21px;min-height:650px}.hero{grid-template-columns:1fr}.hero .cat-wrap{min-height:180px;order:-1;transform:scale(.82)}.map-screen{padding:22px 14px}.map{height:490px}.place{width:103px;font-size:11px}.p0{left:3%;bottom:9%}.p1{left:28%;top:37%}.p2{left:54%;top:22%}.p3{right:2%;bottom:9%}.house{font-size:42px}.map-head{align-items:start}.top{padding:0 6px}.task{padding:4px}.text,.hero p{font-size:16px}}
</style></head><body><main class="shell"><div class="top"><div>✦ СНЕГОГРАДСКОЕ ДЕЛО</div><div class="stat" id="score">⭐ 0</div></div><section class="book"><div class="paper-edge"></div><div id="app"></div></section></main><script>
const app=document.querySelector('#app'),state={stage:-1,stars:0,quality:'',letters:''},places=[['p0','🕰️','Площадь\nзастывших часов'],['p1','✉️','Туманный\nпочтамт'],['p2','🌲','Лес\nпотерянных даров'],['p3','🔭','Крыши\nзвездочётов']],pos=[['8%','77%'],['34%','43%'],['62%','31%'],['84%','77%']];function score(n=0){state.stars+=n;document.querySelector('#score').textContent=`⭐ ${state.stars}`}function setScreen(html){app.innerHTML=`<div class="screen">${html}</div>`;window.scrollTo({top:0,behavior:'smooth'})}function cat(){return `<div class="cat-wrap"><div class="cat"><div class="tail"></div><div class="body"></div><div class="head"><div class="face"></div><div class="nose"></div></div><div class="scarf"></div></div></div>`}function intro(){setScreen(`<div class="hero"><div><span class="eyebrow">Уютный квест на 10–15 минут</span><h1>Снегоград<br>без Нового года</h1><p>Утром котик-детектив Плюш заметил странное: Главная Звезда исчезла, городские часы застыли без полуночи, а на улицах стало непривычно тихо.</p><p>Найдите четыре искры праздника — и верните Снегограду Новый год.</p><button class="btn gold" onclick="showMap()">Взять дело Плюша →</button></div><div>${cat()}<div class="hero-stars">✦ ✧ ✦</div></div></div>`)}function showMap(){let dots=places.map((_,i)=>`<i class="${i<=state.stage?'on':''}"></i>`).join(''),nodes=places.map(([cls,icon,name],i)=>`<button ${i>state.stage+1?'disabled':''} class="place ${cls} ${i===state.stage+1?'current':''} ${i<=state.stage?'done':''}" onclick="openPlace(${i})"><span>${i<=state.stage?'✨':icon}</span>${i<=state.stage?'Искра найдена':name.replace('\\n','<br>')}</button>`).join(''),p=pos[Math.max(0,state.stage)];setScreen(`<div class="map-screen"><div class="map-head"><div><span class="eyebrow">Карта Снегограда</span><h2>${state.stage<3?'Ищем искры праздника':'Дорога к Главной Звезде'}</h2></div><div class="progress">${dots}</div></div><div class="map"><div class="river"></div><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="house h1">🏠</div><div class="house h2">🏘️</div><div class="house h3">🎄</div><span class="label l1">тихие улочки</span><span class="label l2">центр города</span><span class="label l3">снежные крыши</span>${nodes}<div class="map-cat walk" style="left:${p[0]};top:${p[1]}"><span>🐈</span></div></div><p class="hint">Нажмите на светящуюся точку. Плюш уже готов к следующей подсказке.</p></div>`)}function openPlace(i){if(i!==state.stage+1)return;[plaza,post,forest,observatory][i]()}function task(n,t,b){setScreen(`<div class="task"><span class="badge">Искра ${n} из 4</span><h2>${t}</h2>${b}</div>`)}function plaza(){task(1,'Площадь застывших часов',`<div class="story-box">На площади Плюша встречает фонарщик. «Часы пойдут, когда ты назовёшь то, что делает зимний вечер праздничным — даже без гирлянд».</div><div class="options"><button class="option" onclick="pick(false,'Варежки замечательные, но они греют только руки.')">🧤 Тёплые варежки</button><button class="option" onclick="pick(true,'Часы тихо тикнули — и на площади вспыхнул первый фонарь. Верно: праздник начинается с людей рядом.')">🫖 Чай и разговор</button><button class="option" onclick="pick(false,'Колокольчик звенит красиво, но не собирает за одним столом.')">🔔 Серебряный колокольчик</button></div><div id="feedback"></div>`)}function pick(ok,text){feedback.innerHTML=`<div class="feedback ${ok?'':'bad'}">${text}${ok?'<br><button class="btn" onclick="complete(0)">Вернуться на карту →</button>':''}</div>`;if(ok){score();document.querySelectorAll('.option').forEach(x=>x.disabled=true)}}function post(){task(2,'Туманный почтамт',`<div class="story-box">Снеговик-почтальон перепутал буквы в письме от Звезды. «Они сами встали в очередь, но я теперь не понимаю, что прочитать!»</div><p class="text">Соберите слово — оно открывает почтовый фонарь.</p><div class="answer-line" id="word"></div><div class="letter-grid">${['Ё','К','Л','А','Н'].map(x=>`<button class="letter" onclick="letter(this,'${x}')">${x}</button>`).join('')}</div><p class="hint">Подсказка: этот колючий персонаж очень любит огоньки.</p><div id="feedback"></div>`)}function letter(el,l){if(el.classList.contains('used'))return;state.letters+=l;el.classList.add('used');word.textContent=state.letters;if(state.letters==='ЁЛКА'){score();feedback.innerHTML=`<div class="feedback">Почтовый фонарь зажёгся, а из конверта выпорхнула вторая искра.<br><button class="btn" onclick="complete(1)">К лесной тропе →</button></div>`}else if(!'ЁЛКА'.startsWith(state.letters)){feedback.innerHTML='<div class="feedback bad">Кажется, письмо снова спуталось. Начнём заново.</div>';setTimeout(()=>{state.letters='';post()},700)}}function forest(){task(3,'Лес потерянных даров',`<div class="story-box">В лесу Плюш находит три тропы. На одной блестит снежинка, на другой слышен звон, на третьей снеговик пытается достать свою карту из сугроба.</div><p class="text">Как поступит котик-детектив?</p><div class="choice-row"><button class="choice" onclick="choose('Смелость','Плюш идёт на звон и находит упряжку с третьей искрой. Отличная интуиция!')">🔔 Пойти на звон</button><button class="choice" onclick="choose('Внимательность','Плюш читает следы и находит тайную тропу. Наблюдательность сработала!')">👣 Изучить следы</button><button class="choice" onclick="choose('Доброта','Плюш сначала помогает снеговику — и получает точное направление. Добро всегда знает короткую дорогу.')">☃️ Помочь снеговику</button></div><div id="feedback"></div>`)}function choose(q,text){state.quality=q;score();feedback.innerHTML=`<div class="feedback">${text}<br><button class="btn" onclick="complete(2)">Подняться на крыши →</button></div>`;document.querySelectorAll('.choice').forEach(x=>x.disabled=true)}function observatory(){task(4,'Крыши звездочётов',`<div class="story-box">На крыше стоит старый телескоп. В нём мерцает последняя искра, но стекло заперто коротким словом.</div><div class="riddle">«Не птица, а летит; не самолёт, а его можно отпустить в небо вместе с желанием. Что это?»</div><p class="hint">Он бывает воздушным и новогодним.</p><div class="code"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><button class="btn gold" onclick="code()">Зажечь искру →</button><div id="feedback"></div>`)}function code(){let v=[...document.querySelectorAll('.code input')].map(x=>x.value).join('').toUpperCase();if(v==='ШАР'){score();feedback.innerHTML=`<div class="feedback">Телескоп засиял. Четвёртая искра вернулась к Звезде!<br><button class="btn" onclick="complete(3)">Спасти Новый год →</button></div>`}else feedback.innerHTML='<div class="feedback bad">Пока не открывается. Подсказка: слово из трёх букв.</div>'}function complete(i){state.stage=i;showMap();if(i===3)setTimeout(final,500)}function final(){let pred={Смелость:'В новом году один своевременный шаг откроет дверь, которую вы давно замечали. Доверьтесь своему ясному «да».',Внимательность:'В новом году важная возможность спрячется в небольшой детали. Ваше умение замечать поможет собрать большую картину.',Доброта:'В новом году ваше простое участие станет для кого-то поддержкой — и вернётся неожиданно тёплым ответом.'}[state.quality];setScreen(`<div class="ending"><span class="eyebrow">Дело раскрыто</span><div class="confetti">✦ ❄ ✧ 🎉 ✦</div><h1>Новый год<br>вернулся в Снегоград!</h1>${cat()}<p class="text">Плюш нашёл все искры, часы пробили полночь, а город снова загорелся. За миссию вы получили <b>${state.stars} звёзд</b>.</p><div class="card"><h3>Ваш символ года: ${state.quality}</h3><p>${pred}</p></div><button class="btn ghost" onclick="restart()">Пройти историю ещё раз</button><p class="hint">Результат остаётся только в этом браузере — никаких рейтингов и сравнений.</p></div>`)}function restart(){state.stage=-1;state.stars=0;state.quality='';state.letters='';score(0);intro()}intro();
</script></body></html>
